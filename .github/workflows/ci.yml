name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "0 6 * * 1"  # weekly Monday at 06:00 UTC

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install system packages (build deps for mysqlclient)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev pkg-config default-libmysqlclient-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Prepare instance directory
        run: |
          mkdir -p instance

      - name: Validate dependencies
        run: |
          pip check

      - name: Install pip-audit
        run: |
          pip install pip-audit

      - name: Security audit (pip-audit)
        continue-on-error: true
        run: |
          pip-audit

      - name: Run test suite (SQLite)
        env:
          FORCE_SQLITE_FOR_TESTS: "1"
        run: |
          pytest -q
