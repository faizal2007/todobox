name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "0 6 * * 1"  # weekly Monday at 06:00 UTC

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, mariadb, postgres]

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: rootpw
          MARIADB_DATABASE: todobox_test
          MARIADB_USER: test
          MARIADB_PASSWORD: testpw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -P 3306 --silent" --health-interval=10s --health-timeout=5s --health-retries=10

      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: todobox_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: testpw
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -h 127.0.0.1 -p 5432" --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install system packages (build deps for mysqlclient & py-spy)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev pkg-config default-libmysqlclient-dev \
            rustc cargo libunwind-dev

      - name: Set DB env (sqlite)
        if: matrix.db == 'sqlite'
        run: |
          echo "FORCE_SQLITE_FOR_TESTS=1" >> $GITHUB_ENV

      - name: Set DB env (mariadb)
        if: matrix.db == 'mariadb'
        run: |
          echo "DATABASE_DEFAULT=mysql" >> $GITHUB_ENV
          echo "TEST_DB_URL=127.0.0.1:3306" >> $GITHUB_ENV
          echo "TEST_DB_USER=test" >> $GITHUB_ENV
          echo "TEST_DB_PASSWORD=testpw" >> $GITHUB_ENV
          echo "TEST_DB_NAME=todobox_test" >> $GITHUB_ENV
          echo "DB_URL=127.0.0.1:3306" >> $GITHUB_ENV
          echo "DB_USER=test" >> $GITHUB_ENV
          echo "DB_PASSWORD=testpw" >> $GITHUB_ENV
          echo "DB_NAME=todobox_test" >> $GITHUB_ENV

      - name: Set DB env (postgres)
        if: matrix.db == 'postgres'
        run: |
          echo "DATABASE_DEFAULT=postgres" >> $GITHUB_ENV
          echo "TEST_DB_URL=127.0.0.1:5432" >> $GITHUB_ENV
          echo "TEST_DB_USER=test" >> $GITHUB_ENV
          echo "TEST_DB_PASSWORD=testpw" >> $GITHUB_ENV
          echo "TEST_DB_NAME=todobox_test" >> $GITHUB_ENV
          echo "DB_URL=127.0.0.1:5432" >> $GITHUB_ENV
          echo "DB_USER=test" >> $GITHUB_ENV
          echo "DB_PASSWORD=testpw" >> $GITHUB_ENV
          echo "DB_NAME=todobox_test" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Wait for MariaDB
        if: matrix.db == 'mariadb'
        run: |
          sudo apt-get install -y mysql-client
          for i in {1..30}; do mysqladmin ping -h 127.0.0.1 -P 3306 --silent && break || sleep 2; done

      - name: Wait for Postgres
        if: matrix.db == 'postgres'
        run: |
          sudo apt-get install -y postgresql-client
          for i in {1..30}; do pg_isready -h 127.0.0.1 -p 5432 && break || sleep 2; done

      - name: Prepare instance directory
        run: |
          mkdir -p instance

      - name: Validate dependencies
        run: |
          pip check

      - name: Validate Markdown locations (repository)
        run: |
          if [ -f scripts/validate_markdown_locations.py ]; then
            python scripts/validate_markdown_locations.py
          else
            echo "ℹ️ validate_markdown_locations.py not found; skipping repo-wide check."
          fi

      - name: Validate Markdown file locations (PR diff; additions/modifications only)
        if: github.event_name == 'pull_request'
        run: |
          ALLOWLIST=("README.md" "CHANGELOG.md" "SECURITY.md" ".copilot-markdown-rules.md")
          BAD_FILES=()
          while IFS=$'\t' read -r STATUS PATH; do
            # Only consider Added or Modified files
            if [[ "$STATUS" == "A" || "$STATUS" == "M" ]]; then
              if [[ "$PATH" =~ ^[^/]+\.md$ ]]; then
                allowed=false
                for a in "${ALLOWLIST[@]}"; do
                  if [[ "$PATH" == "$a" ]]; then
                    allowed=true
                    break
                  fi
                done
                if [[ "$allowed" == false ]]; then
                  BAD_FILES+=("$PATH")
                fi
              fi
            fi
          done < <(git diff --name-status "${{ github.event.pull_request.base.sha }}".."${{ github.sha }}")

          if [[ ${#BAD_FILES[@]} -gt 0 ]]; then
            echo "❌ Root-level Markdown not allowed (added/modified): ${BAD_FILES[*]}"
            echo "Move docs into docs/ or add to allowlist if truly necessary."
            exit 1
          else
            echo "✅ Markdown locations valid."
          fi

      - name: Install pip-audit
        run: |
          pip install pip-audit

      - name: Security audit (pip-audit)
        continue-on-error: true
        run: |
          pip-audit || echo "pip-audit found vulnerabilities (non-blocking)"

      - name: Initialize DB schema (create tables)
        run: |
          python - <<'PY'
          from app import db, app
          with app.app_context():
              db.create_all()
              print("Initialized schema via db.create_all() against", db.engine.url)
          PY

      - name: Run test suite
        run: |
          pytest -q
